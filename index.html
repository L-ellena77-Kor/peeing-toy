<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0d0c0f;color:#f3e7d6;font-family:'Jua',sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}
header{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}
h1{margin:0;font-size:clamp(14px,3.8vw,26px);font-weight:400;white-space:nowrap;overflow:hidden}
h1 span{color:#e9b872}
#fs{flex:0 0 auto;font-family:inherit;font-size:16px;background:#e9b872;color:#2a1408;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:0 10px 10px;height:calc(100dvh - 52px)}
.panel{position:relative;overflow:hidden;border:3px solid #efe3d0;border-radius:10px;min-height:0;min-width:0}
.panel svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
@media (orientation:portrait){
  main{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:calc((100dvh - 72px)/2);height:auto}
}
.panel{cursor:zoom-in}
main.zoom{grid-template-columns:1fr!important;grid-template-rows:1fr!important;grid-auto-rows:auto!important;height:calc(100dvh - 52px)!important}
main.zoom .panel{display:none;cursor:default}
main.zoom .panel.on{display:block;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
.hb{flex:0 0 auto;font-family:inherit;font-size:16px;background:#2a2730;color:#f3e7d6;border:2px solid #e9b872;border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:none}
body.zoomed .hb{display:inline-block}
.hint{font-size:.6em;color:#a99f93;margin-left:8px}
body.zoomed .hint{display:none}
.hbar{display:flex;gap:8px;align-items:center;flex:0 0 auto}
text{font-family:'Jua',sans-serif}
.btn{cursor:pointer}
.btn:hover rect{filter:brightness(1.12)}
.btn:active{transform-box:fill-box}
.btn.off{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<header>

    <button class="hb" id="prevP">◀</button>
    <button class="hb" id="gridP">네 컷 보기</button>
    <button class="hb" id="nextP">▶</button>

    </filter>
  </defs>
</svg>

<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* ---------- 이싱 찻주전자 ---------- */
function teapot(){return `<g filter="url(#grain)">
 <path d="M-34 -8 C-58 -16 -60 20 -32 14" fill="none" stroke="#4e2418" stroke-width="7" stroke-linecap="round"/>

 <path d="M-30 14 Q0 27 30 14" fill="none" stroke="#2e130d" stroke-width="2" opacity=".5"/>
</g>`}

<g filter="url(#grain)">

 <ellipse cx="11" cy="-24" rx="10" ry="16" fill="url(#clay)"/>
 <ellipse cx="-25" cy="-64" rx="7.5" ry="19" transform="rotate(14 -25 -64)" fill="url(#clay)"/>
 <ellipse cx="0" cy="-62" rx="26" ry="35" fill="url(#clay)"/>
 <ellipse cx="26" cy="-64" rx="7.5" ry="19" transform="rotate(-14 26 -64)" fill="url(#clay)"/>
 <path d="M-10 -96 L-19 -86 M10 -96 L19 -86" stroke="#8a3a22" stroke-width="3"/>
 <path d="M-19 -86 L19 -86 Q27 -60 20 -36 Q0 -29 -18 -36 Q-26 -60 -19 -86Z" fill="url(#clayRed)"/>
 <circle cx="2" cy="-122" r="30" fill="url(#clay)"/>
 <path d="M-30 -132 Q-24 -160 4 -157 Q30 -158 35 -132 Q20 -146 2 -146 Q-18 -146 -30 -132Z" fill="#3a1a12"/>
 <circle cx="-21" cy="-153" r="11" fill="#3a1a12"/><circle cx="25" cy="-153" r="11" fill="#3a1a12"/>
 <path d="M-8 -124 q5 -6 10 0 M12 -124 q5 -6 10 0" stroke="#2a110a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
 <path d="M4 -111 q8 9 16 0 z" fill="#3a140c"/>
 <ellipse cx="-12" cy="-112" rx="6" ry="3.5" fill="#e07a52" opacity=".6"/><ellipse cx="28" cy="-112" rx="5" ry="3.5" fill="#e07a52" opacity=".6"/>
 <ellipse cx="-10" cy="-137" rx="11" ry="6" fill="#fff" opacity=".22"/>
 <ellipse cx="-13" cy="-74" rx="5" ry="10" fill="#fff" opacity=".16"/>
 <circle cx="-24" cy="-156" r="3" fill="#fff" opacity=".2"/>
</g>
<g id="${p}tint" opacity="0">
 <circle cx="2" cy="-122" r="30"/><circle cx="-21" cy="-153" r="11"/><circle cx="25" cy="-153" r="11"/>
 <ellipse cx="0" cy="-62" rx="26" ry="35"/><ellipse cx="-10" cy="-24" rx="10" ry="16"/><ellipse cx="11" cy="-24" rx="10" ry="16"/>
 <rect x="-44" y="-10" width="88" height="13"/>
</g>
<clipPath id="${p}clip"><ellipse cx="0" cy="-66" rx="18" ry="30"/></clipPath>
<ellipse cx="0" cy="-66" rx="19" ry="31" fill="#1c0e0a" stroke="#f3e7d6" stroke-width="1.6" stroke-dasharray="4 3"/>
<g clip-path="url(#${p}clip)">
 <rect id="${p}water" x="-24" y="-36" width="48" height="0" fill="#4aa8e8"/>
 <g id="${p}dots"></g>
</g>
<path d="M11 -38 L16 -31" stroke="#f3e7d6" stroke-width="1.3" stroke-dasharray="2 2"/>
<circle cx="16" cy="-31" r="2.8" fill="#120604"/>
${label?`<path d="M-46 -98 L-16 -84" stroke="#ffe7b8" stroke-width="1.3"/>
<text x="-48" y="-100" font-size="13" fill="#ffe7b8" text-anchor="end">속은 빈 공간</text>
<text x="24" y="-14" font-size="12" fill="#ffe7b8">구멍</text>
<g id="${p}arrow" opacity="0" stroke="#7fd0ff" stroke-width="2.6" fill="none" stroke-linecap="round">
 <path d="M40 -20 L22 -29"/><path d="M29 -33 L21 -29 L27 -22"/>
</g>`:''}`}

const F3={x:150,y:268}, F4={x:120,y:268};
const fig3=$('fig3'), fig4=$('fig4');
fig3.innerHTML=boy('b3',true); fig4.innerHTML=boy('b4',false);
function setFig(g,F,x,y){F.x=x;F.y=y;g.setAttribute('transform',`translate(${x},${y})`);}
setFig(fig3,F3,150,268); setFig(fig4,F4,120,268);

/* 공기 알갱이 */
function mkInst(p){
  const dots=[];const g=$(p+'dots');
  for(let i=0;i<14;i++){
    const c=el('circle',{r:2.2,fill:'#fff3d6'},g);
    const ang=Math.random()*Math.PI*2;
    dots.push({c,x:(Math.random()-.5)*20,y:-66+(Math.random()-.5)*40,vx:Math.cos(ang),vy:Math.sin(ang),s:.8+Math.random()*.4});
  }
  return {dots,water:$(p+'water'),tint:$(p+'tint'),arrow:$(p+'arrow')};
}
const insts=[mkInst('b3'),mkInst('b4')];

const M={level:0,count:14,heat:0,cool:0,heated:false,hold:false,arrows:false};

/* 찻주전자 위치 */
const P3={cx:98,cy:72,a:0}, P4={cx:68,cy:72,a:0};
function rotPot(g,P,a){P.a=a;g.setAttribute('transform',`translate(${P.cx},${P.cy}) rotate(${a})`);}
rotPot($('pot3'),P3,0);rotPot($('pot4'),P4,0);
function tipOf(P){const r=P.a*Math.PI/180,lx=56,ly=-19;return [P.cx+lx*Math.cos(r)-ly*Math.sin(r),P.cy+lx*Math.sin(r)+ly*Math.cos(r)];}

/* ---------- 도구 ---------- */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(ms,f){return new Promise(res=>{const s=performance.now();function step(n){const t=Math.min(1,(n-s)/ms);f(ease(t),t);if(t<1)requestAnimationFrame(step);else res();}requestAnimationFrame(step);});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false;
function setBusy(b){busy=b;document.querySelectorAll('.btn').forEach(e=>e.classList.toggle('off',b));}

function drip(layer,P,yEnd,ms){
  const end=performance.now()+ms;
  return new Promise(res=>{
    const iv=setInterval(()=>{
      if(performance.now()>end){clearInterval(iv);setTimeout(res,380);return;}
      const [x,y]=tipOf(P);const c=el('ellipse',{cx:x,cy:y,rx:2.8,ry:4.2,fill:'#a8dcff'},layer);const t0=performance.now();
      (function f(n){const t=Math.min(1,(n-t0)/340);c.setAttribute('cy',y+(yEnd-y)*t*t);if(t<1)requestAnimationFrame(f);else c.remove();})(t0);
    },75);
  });
}
function puff(layer,x,y){
  const c=el('circle',{cx:x,cy:y,r:3,fill:'#fff3d6',opacity:.9},layer);const dx=14+Math.random()*24,dy=-10-Math.random()*22;const t0=performance.now();
  (function f(n){const t=Math.min(1,(n-t0)/900);c.setAttribute('cx',x+dx*t);c.setAttribute('cy',y+dy*t);c.setAttribute('r',3+4*t);c.setAttribute('opacity',.9*(1-t));if(t<1)requestAnimationFrame(f);else c.remove();})(t0);
}
function splash(layer,x,y){
  for(let k=0;k<2;k++){const e=el('ellipse',{cx:x,cy:y,rx:2,ry:1,fill:'none',stroke:'#8fd3ff','stroke-width':2.5},layer);const t0=performance.now()+k*150;
  (function f(n){const t=Math.max(0,Math.min(1,(n-t0)/600));e.setAttribute('rx',2+22*t);e.setAttribute('ry',1+5*t);e.setAttribute('opacity',1-t);if(t<1)requestAnimationFrame(f);else e.remove();})(performance.now());}
}

/* ---------- 말풍선 · 자막 크기 맞추기 ---------- */
function fit(g){
  const t=g.querySelector('text');const bb=t.getBBox();const think=g.classList.contains('think');
  const px=think?16:13,py=think?9:8;const x=bb.x-px,y=bb.y-py,w=bb.width+2*px,h=bb.height+2*py;
  const r=g.querySelector('rect');
  if(r){r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx',think?h/2:14);}
  const path=g.querySelector('path');const tail=g.dataset.tail;
  if(path&&tail){
    const [tx,ty]=tail.split(',').map(Number);
    if(think){
      const sx=x+18,sy=y+h-4;
      path.setAttribute('d',[0.35,0.65,0.88].map((k,i)=>{const cx=sx+(tx-sx)*k,cy=sy+(ty-sy)*k,rr=7-i*2;return `M${cx-rr} ${cy} a${rr} ${rr} 0 1 0 ${2*rr} 0 a${rr} ${rr} 0 1 0 ${-2*rr} 0`;}).join(' '));
    }else{
      const bx=Math.min(Math.max(tx,x+22),x+w-22);
      const below=ty>y+h, by=below?y+h-2:y+2;
      path.setAttribute('d',`M${bx-10} ${by} L${bx+10} ${by} L${tx} ${ty}Z`);
    }
  }
}
function fitCap(g){const t=g.querySelector('text');const bb=t.getBBox();const r=g.querySelector('rect');
  r.setAttribute('x',bb.x-12);r.setAttribute('y',bb.y-6);r.setAttribute('width',bb.width+24);r.setAttribute('height',bb.height+12);r.setAttribute('rx',8);}
function fitAll(){document.querySelectorAll('.bub').forEach(fit);document.querySelectorAll('.cap').forEach(fitCap);}
fitAll(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);

function say3(s){$('n3').textContent=s;}
function say4(s){const g=$('bub4');g.querySelector('text').textContent=s;fit(g);}

/* ---------- 그리기 루프 ---------- */
let last=performance.now();
function loop(n){
  const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;
  if(!M.hold){M.heat=Math.max(0,M.heat-dt*.07);M.cool=Math.max(0,M.cool-dt*.07);}
  const wt=-36-M.level*60;
  const spd=22*(1+M.heat*2.6-M.cool*.45);   // 뜨거울수록 빠르게
  const RX=15.8,RY=27.8,CY=-66;              // 배 속 빈 공간(입자 중심이 움직일 수 있는 범위)
  insts.forEach(I=>{
    I.water.setAttribute('y',wt);I.water.setAttribute('height',Math.max(0,-36-wt+2));
    I.dots.forEach((d,i)=>{
      if(i>=M.count){d.c.setAttribute('opacity',0);return;}
      d.c.setAttribute('opacity',1);
      // 이동
      // 방향을 조금씩 무작위로 틀고, 가끔은 완전히 새 방향으로(다른 입자와 부딪힘)
      let a=Math.atan2(d.vy,d.vx)+(Math.random()-.5)*5*Math.sqrt(dt);
      if(Math.random()<dt*1.2*(1+M.heat))a=Math.random()*Math.PI*2;
      d.vx=Math.cos(a);d.vy=Math.sin(a);
      d.x+=d.vx*spd*d.s*dt; d.y+=d.vy*spd*d.s*dt;
      // 공간 벽에 부딪히면 튕기기
      const ex=d.x/RX, ey=(d.y-CY)/RY, q=ex*ex+ey*ey;
      if(q>1){
        let nx=d.x/(RX*RX), ny=(d.y-CY)/(RY*RY); const nl=Math.hypot(nx,ny); nx/=nl; ny/=nl;
        const dot=d.vx*nx+d.vy*ny; if(dot>0){d.vx-=2*dot*nx; d.vy-=2*dot*ny;}
        const k=1/Math.sqrt(q); d.x*=k; d.y=CY+(d.y-CY)*k;
      }
      // 물 표면에 부딪히면 튕기기
      const lim=wt-2.6;
      if(d.y>lim){ d.y=lim-Math.random()*1.5; if(d.vy>0)d.vy=-d.vy; }
      d.c.setAttribute('cx',d.x); d.c.setAttribute('cy',d.y);
    });
    if(M.heat>=M.cool){I.tint.setAttribute('fill','#ff7a2a');I.tint.setAttribute('opacity',M.heat*.33);}
    else{I.tint.setAttribute('fill','#5ab8ff');I.tint.setAttribute('opacity',M.cool*.3);}
    if(I.arrow)I.arrow.setAttribute('opacity',M.arrows?(.5+.5*Math.sin(n/120)):0);
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 컷별 음악 (오음 음계로 지은 옛 중국풍 곡) ---------- */
let AC=null,master=null,curM=null,mTimer=null;
const NF={D2:73.42,A2:110,D3:146.83,E3:164.81,'F#3':185,A3:220,B3:246.94,D4:293.66,E4:329.63,'F#4':369.99,A4:440,B4:493.88,D5:587.33,E5:659.26,'F#5':739.99,A5:880};
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.55;
  const rev=AC.createConvolver(),len=Math.floor(AC.sampleRate*2.4),buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  rev.buffer=buf;const wet=AC.createGain();wet.gain.value=.32;
  master.connect(AC.destination);master.connect(rev);rev.connect(wet);wet.connect(AC.destination);
}
function pluck(f,t,dur,vol,slide){ // 고쟁·고금 느낌의 뜯는 소리
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='triangle';o2.type='sine';lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(9000,f*9),t);lp.frequency.exponentialRampToValueAtTime(Math.max(260,f*1.4),t+dur);
  if(slide){o.frequency.setValueAtTime(f*.94,t);o.frequency.exponentialRampToValueAtTime(f,t+.14);o2.frequency.setValueAtTime(f*1.88,t);o2.frequency.exponentialRampToValueAtTime(f*2,t+.14);}
  else{o.frequency.setValueAtTime(f,t);o2.frequency.setValueAtTime(f*2,t);}
  g2.gain.value=.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(master);
  o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
}
function wood(t,vol,f){ // 목어(나무 딱딱이)
  const n=Math.floor(AC.sampleRate*.06),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=b;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=9;g.gain.value=vol*3;
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
}
function drum(t,vol){ // 북
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(48,t+.35);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.5);
}
function gong(t,vol){ // 작은 징
  [1,1.48,2.09,2.74].forEach((k,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    o.frequency.setValueAtTime(196*k,t);o.frequency.exponentialRampToValueAtTime(196*k*.985,t+2.5);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol/(i+1),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+3);});
}
function mel(str,vol,len,slide){const ev=[];let b=0;str.trim().split(/\s+/).forEach(tok=>{const [n,d]=tok.split(':');const dd=+d;if(n!=='r'){const f=NF[n];ev.push({b,fn:(t,spb)=>pluck(f,t,Math.max(.6,dd*spb*len),vol,slide)});}b+=dd;});return ev;}
function at(beats,fn){return beats.map(b=>({b,fn}));}
const PIECES={
  1:{bpm:56,len:32,ev:[ // 가마 마을 — 느린 고금
    ...mel('A3:2 B3:1 D4:1 E4:3 D4:1 B3:2 A3:1 F#3:1 A3:4 D4:2 E4:1 F#4:1 A4:3 F#4:1 E4:2 D4:1 B3:1 D4:4',.5,1.6,true),
    ...[0,8,16,24].map((b,i)=>({b,fn:t=>pluck(i%2?NF.A2:NF.D2,t,5,.4,false)})),
    ...at([0,16],t=>drum(t,.35))]},
  2:{bpm:76,len:16,ev:[ // 찻자리 — 잔잔한 고쟁
    ...mel('D4:.5 F#4:.5 A4:.5 D5:.5 B4:1 A4:1 F#4:.5 A4:.5 B4:.5 D5:.5 E5:2 D5:.5 B4:.5 A4:.5 F#4:.5 E4:1 F#4:1 A4:.5 F#4:.5 E4:.5 D4:.5 D4:2',.38,1.4,false),
    ...[[0,'D3'],[4,'A3'],[8,'B3'],[12,'A3']].map(([b,n])=>({b,fn:(t,spb)=>pluck(NF[n],t,3*spb,.3,true)}))]},
  3:{bpm:104,len:16,ev:[ // 동자 등장 — 통통 튀는 가락
    ...mel('D5:.5 B4:.5 A4:.5 B4:.5 D5:1 r:.5 E5:.5 D5:.5 B4:.5 A4:.5 F#4:.5 A4:1 r:1 E4:.5 F#4:.5 A4:.5 B4:.5 A4:.5 F#4:.5 E4:1 D4:.5 E4:.5 F#4:.5 A4:.5 D4:1 r:1',.34,.7,false),
    ...Array.from({length:16},(_,i)=>({b:i,fn:t=>wood(t,i%4===0?.22:.12,i%2?950:1350)})),
    ...[0,4,8,12].map((b,i)=>({b,fn:(t,spb)=>pluck(i%2?NF.A3:NF.D3,t,1.5*spb,.26,false)}))]},
  4:{bpm:120,len:16,ev:[ // 쭈욱~ — 신나는 잔치 가락
    ...mel('E5:.5 D5:.5 B4:.5 D5:.5 E5:.5 F#5:.5 E5:1 D5:.5 B4:.5 A4:.5 B4:.5 D5:2 E5:.5 E5:.5 D5:.5 E5:.5 F#5:.5 A5:.5 F#5:1 E5:.5 D5:.5 B4:.5 A4:.5 D5:2',.32,.8,false),
    ...at([0,2,4,6,8,10,12,14],t=>drum(t,.42)),
    ...at([1.5,3.5,5.5,7.5,9.5,11.5,13.5,15.5],t=>wood(t,.14,1250)),
    ...[0,2,4,6,8,10,12,14].map((b,i)=>({b,fn:(t,spb)=>pluck(i%2?NF.A3:NF.D3,t,1.6*spb,.24,false)})),
    ...at([0],t=>gong(t,.18))]}
};
Object.values(PIECES).forEach(P=>P.ev.sort((a,b)=>a.b-b.b));
function stopMusic(){clearInterval(mTimer);mTimer=null;curM=null;
  if(master&&AC){const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+.25);}
  updMus();}
function playMusic(id){
  initAudio();if(AC.state==='suspended')AC.resume();
  stopMusic();
  const P=PIECES[id],spb=60/P.bpm;let idx=0,loopStart=AC.currentTime+.35;
  master.gain.setValueAtTime(0,AC.currentTime+.3);master.gain.linearRampToValueAtTime(.55,AC.currentTime+.5);
  curM=id;
  mTimer=setInterval(()=>{const ahead=AC.currentTime+.3;
    for(let guard=0;guard<200;guard++){const ev=P.ev[idx],t=loopStart+ev.b*spb;if(t>ahead)break;ev.fn(t,spb);idx++;if(idx>=P.ev.length){idx=0;loopStart+=P.len*spb;}}
  },40);
  updMus();
}
function updMus(){document.querySelectorAll('.mus').forEach(g=>{const on=+g.dataset.m===curM;
  g.querySelector('.bg').setAttribute('fill',on?'#e9b872':'#000');g.querySelector('.bg').setAttribute('fill-opacity',on?1:.6);
  g.querySelector('.ic').setAttribute('fill',on?'#2a1408':'#ffe7b8');g.querySelector('.ic').setAttribute('stroke',on?'#2a1408':'#ffe7b8');
  g.querySelector('.ring').setAttribute('opacity',on?1:0);});}
document.querySelectorAll('.mus').forEach(g=>g.addEventListener('click',()=>{const id=+g.dataset.m;if(curM===id)stopMusic();else playMusic(id);}));
(function ringLoop(n){document.querySelectorAll('.mus .ring').forEach(r=>{if(r.getAttribute('opacity')!=='0'){const k=(n/900)%1;r.setAttribute('r',17+k*9);r.setAttribute('stroke-opacity',1-k);}});requestAnimationFrame(ringLoop);})(0);


/* ---------- 1컷: 이싱 위치 지도 ---------- */
(function(){
  const g=$('mapG'),dim=$('mapDim'),hint=$('mapHint');
  const BIG={x:54,y:76,k:1.38}, SMALL={x:16,y:58,k:.36};
  let st={...SMALL},busyMap=false,shown=false;
  const set=(o,a)=>{g.setAttribute('transform',`translate(${o.x},${o.y}) scale(${o.k})`);if(a!==undefined)g.setAttribute('opacity',a);};
  const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,k:a.k+(b.k-a.k)*t});
  async function showBig(first){
    if(busyMap)return;busyMap=true;hint.setAttribute('opacity',0);
    const from=first?{...BIG,k:BIG.k*.8}:st;
    await tween(first?500:600,t=>{set(lerp(from,BIG,t),first?t:1);dim.setAttribute('opacity',.45*t);});
    st={...BIG};
    await wait(3200);
    await tween(800,t=>{set(lerp(BIG,SMALL,t),1);dim.setAttribute('opacity',.45*(1-t));});
    st={...SMALL};hint.setAttribute('opacity',1);busyMap=false;
  }
  set(SMALL,0);
  g.addEventListener('click',()=>showBig(false));
  setTimeout(()=>showBig(true),700);
})();

/* ---------- 장면 크게 보기 + 자동 음악 ---------- */
(function(){
  const main=document.querySelector('main'),panels=[...document.querySelectorAll('.panel')];
  let cur=-1;
  function open(i){
    cur=(i+4)%4;
    panels.forEach((p,j)=>p.classList.toggle('on',j===cur));
    main.classList.add('zoom');document.body.classList.add('zoomed');
    playMusic(cur+1);
  }
  function close(){cur=-1;main.classList.remove('zoom');document.body.classList.remove('zoomed');panels.forEach(p=>p.classList.remove('on'));stopMusic();}
  panels.forEach((p,i)=>p.addEventListener('click',e=>{
    if(e.target.closest('.btn,.mus,#mapG'))return;
    if(cur===-1)open(i);
  }));
  $('prevP').addEventListener('click',()=>open(cur-1));
  $('nextP').addEventListener('click',()=>open(cur+1));
  $('gridP').addEventListener('click',close);
  document.addEventListener('keydown',e=>{
    if(cur===-1)return;
    if(e.key==='ArrowRight')open(cur+1);else if(e.key==='ArrowLeft')open(cur-1);else if(e.key==='Escape')close();
  });
})();
